name: Kore Framework CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: PHP Lint and Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: pdo, pdo_mysql, json

    - name: Validate Backend Syntax (PHP Lint)
      run: |
        find kore-api -type f -name *.php -exec php -l {} +
        find kore-front -type f -name *.php -exec php -l {} +

    - name: Test Kore CLI Help
      run: |
        php kore-api/kore.php help